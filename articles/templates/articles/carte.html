{% extends 'base.html' %}
{% load static %}

{% block title %}Carte des points d'intérêt - Blog de Voyages{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
    #map {
        height: 600px;
        width: 100%;
        border-radius: 0.5rem;
    }
    .leaflet-popup-content {
        margin: 10px;
    }
    .popup-content {
        padding: 5px;
    }
    .popup-title {
        font-weight: bold;
        margin-bottom: 5px;
        color: #2563eb;
    }
    .popup-category {
        color: #4b5563;
        font-size: 0.875rem;
        margin-bottom: 5px;
    }
    .popup-address {
        color: #6b7280;
        font-size: 0.875rem;
        margin-bottom: 10px;
    }
    .popup-image {
        width: 200px;
        height: 150px;
        object-fit: cover;
        border-radius: 0.25rem;
        margin-bottom: 10px;
    }
    .popup-link {
        display: inline-block;
        padding: 5px 10px;
        background-color: #2563eb;
        color: white;
        text-decoration: none;
        border-radius: 0.25rem;
        font-size: 0.875rem;
    }
    .popup-link:hover {
        background-color: #1d4ed8;
    }
</style>
{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold mb-8">Carte des Points d'Intérêt</h1>
        
        <div id="map" class="shadow-lg"></div>
    </div>
</div>

{{ markers|json_script:"markers-data" }}
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        // Initialiser la carte centrée sur l'Afrique de l'Ouest
        var map = L.map('map').setView([8.0, 2.0], 6);

        // Ajouter le fond de carte OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Marqueurs sérialisés par json_script (échappement sûr), popups construits
        // en nœuds DOM : aucun titre ou adresse n'est interprété comme du HTML.
        var markers = JSON.parse(document.getElementById('markers-data').textContent);

        function el(tag, className, text) {
            var n = document.createElement(tag);
            if (className) n.className = className;
            if (text) n.textContent = text;
            return n;
        }

        markers.forEach(function(marker) {
            var box = el('div', 'popup-content');
            box.appendChild(el('div', 'popup-title', marker.titre));
            box.appendChild(el('div', 'popup-category', marker.categorie));
            if (marker.adresse) box.appendChild(el('div', 'popup-address', marker.adresse));
            if (marker.image) {
                var img = el('img', 'popup-image');
                img.src = marker.image;
                img.alt = marker.titre;
                box.appendChild(img);
            }
            var a = el('a', 'popup-link', "Voir l'article");
            a.href = marker.url;
            box.appendChild(a);

            L.marker([marker.latitude, marker.longitude])
                .bindPopup(box)
                .addTo(map);
        });
    });
</script>
{% endblock %}
